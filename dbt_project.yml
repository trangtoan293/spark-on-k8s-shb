name: 'simple_dbt_project'
version: '1.0.0'
config-version: 2
profile: 'simple_dbt_project'

model-paths: ["models"]
test-paths: ["tests"]
target-path: "/tmp/dbt_target"
log-path: "/tmp/dbt_logs"
clean-targets: ["/tmp/dbt_target", "/tmp/dbt_logs"]

models:
  simple_dbt_project:
    staging:
      +materialized: view
      +file_format: iceberg
    marts:
      +materialized: table
      +file_format: iceberg
      
  # dbt-artifacts package models
  dbt_artifacts:
    +materialized: table
    +schema: monitoring
    +file_format: iceberg

vars:
  # dbt-artifacts configuration
  dbt_artifacts_database: "{{ target.database }}"
  dbt_artifacts_schema: "dbt_artifacts"
  dbt_artifacts_exclude_all_results: true  # Performance optimization for Spark

# Hook to upload artifacts after each run
on-run-end:
  - "{{ dbt_artifacts.upload_results(results) }}"

flags:
  require_explicit_package_overrides_for_builtin_materializations: False
  source_freshness_run_project_hooks: True